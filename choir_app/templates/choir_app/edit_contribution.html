{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hindura Umusanzu - Chorale Getsemani</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background: url("{% static 'choir_app/bg_choir.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .edit-box { 
            background: rgba(255, 255, 255, 0.92) !important; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3) !important; 
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            width: 100%; 
            max-width: 480px; 
        }
        h2 { color: #1e3a8a; text-align: center; margin-top: 0; margin-bottom: 25px; font-weight: 800; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
        .form-group label { font-weight: 700; color: #020617; font-size: 0.95em; }
        .form-group input, .form-group select { padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1em; width: 100%; outline: none; background: white; font-weight: 600; color: #1e3a8a; }
        .btn-container { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { background: #16a34a; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; font-size: 1em; text-align: center; }
        .btn-cancel { background: #64748b; color: white; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; font-size: 1em; text-align: center; }
    </style>
</head>
<body>

    <div class="edit-box">
        <h2>✏️ Hindura Amakuru y'Umusanzu</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Umuririmbyi (Member):</label>
                {{ form.member }}
            </div>
            
            <div class="form-group">
                <label>Impamvu y'Uwishyu (Purpose):</label>
                {{ form.purpose }}
            </div>
            
            <div class="form-group">
                <label>Amafaranga yatanze (Amount FRW):</label>
                {{ form.amount }}
            </div>
            
            <div class="btn-container">
                <button type="submit" class="btn-save">Bika Impinduka</button>
                <a href="/panel/" class="btn-cancel">Subira Inyuma</a>
            </div>
        </form>
    </div>

</body>
</html>

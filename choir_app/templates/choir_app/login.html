<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Chorale Getsemani</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #5a6268; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 400px; }
        h2 { color: #1e3a8a; text-align: center; margin-top: 0; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        .form-group label { font-weight: bold; color: #475569; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1em; width: 100%; outline: none; }
        .btn-signin { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1em; width: 100%; margin-top: 10px; }
        .btn-signin:hover { background: #1d4ed8; }
        .register-link { text-align: center; margin-top: 15px; font-size: 0.9em; }
        .register-link a { color: #2563eb; text-decoration: none; font-weight: bold; }
        .alert-error { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; font-size: 0.9em; margin-bottom: 15px; text-align: center; font-weight: 500; border: 1px solid #fca5a5; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔐 Kwinjira muli System</h2>
        
        <!-- DISPLAY ERROR MESSAGES IF ANY -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <!-- MASTER DROPDOWN INTERFACE (FIXED NAME="ROLE" COMPONENT) -->
            <div class="form-group">
                <label>🎭 Urashaka Kwinjira nka:</label>
                <select name="role" required>
                    <option value="admin">🔐 Ubuyobozi bwa Korali (Admin)</option>
                    <option value="singer">🎤 Umuririmbyi (Singer)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Izina rya User (Username):</label>
                <input type="text" name="username" required placeholder="Andika username yawe...">
            </div>
            
            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" required placeholder="Andika password yawe...">
            </div>
            
            <button type="submit" class="btn-signin">Sign In muli System</button>
        </form>
        
        <div class="register-link">
            Ntabwo uriyandikisha? <a href="{% url 'register' %}">Kora Register Hano</a>
        </div>
    </div>

</body>
</html>

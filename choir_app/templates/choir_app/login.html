{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chorale Getsemani</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0; 
            /* 1. KWINJIZA IFOTO Y'INYUMA IVUYE MURI STATIC REPOSITORY */
            background: url("{% static 'choir_app/bg_choir.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        /* 2. MASTER GLASSMORPHISM BOX (ISANDUKU YABAYE TRANSPARENT NK'IKIRAHURI) */
        .login-box { 
            background: rgba(255, 255, 255, 0.88) !important; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3) !important; 
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            width: 100%; 
            max-width: 420px; 
        }

        h2 { color: #1e3a8a; text-align: center; margin-top: 0; margin-bottom: 25px; font-weight: 800; font-size: 1.6em; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
        .form-group label { font-weight: 700; color: #020617; font-size: 0.95em; }
        .form-group input, .form-group select { padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1em; width: 100%; outline: none; background: rgba(255, 255, 255, 0.9); font-weight: 500; }
        .form-group input:focus, .form-group select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        
        .btn-signin { background: #2563eb; color: white; border: none; padding: 13px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1em; width: 100%; margin-top: 10px; transition: 0.2s; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .btn-signin:hover { background: #1d4ed8; }
        
        .register-link { text-align: center; margin-top: 20px; font-size: 0.95em; color: #1e293b; font-weight: 600; }
        .register-link a { color: #2563eb; text-decoration: none; font-weight: bold; }
        .register-link a:hover { text-decoration: underline; }
        
        .alert-error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 6px; font-size: 0.9em; margin-bottom: 18px; text-align: center; font-weight: 600; border: 1px solid #fca5a5; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔐 Kwinjira muli System</h2>
        
        <!-- DISPLAY ERROR MESSAGES IF ANY -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>🎭 Urashaka Kwinjira nka:</label>
                <select name="role" required>
                    <option value="admin">🔐 Ubuyobozi bwa Korali (Admin)</option>
                    <option value="singer">🎤 Umuririmbyi (Singer)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Izina rya User (Username):</label>
                <input type="text" name="username" required placeholder="Andika username yawe...">
            </div>
            
            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" required placeholder="Andika password yawe...">
            </div>
            
            <button type="submit" class="btn-signin">Sign In muli System</button>
        </form>
        
        <div class="register-link">
            Ntabwo uriyandikisha? <a href="{% url 'register' %}">Kora Register Hano</a>
        </div>
    </div>

</body>
</html>

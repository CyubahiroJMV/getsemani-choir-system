<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guhindura Indirimbo - Ubuyobozi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #5a6268; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .edit-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 500px; }
        h2 { color: #1e3a8a; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px; margin-top: 0; text-align: center; }
        form { display: flex; flex-direction: column; gap: 15px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-save { background: #2b6cb0; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-cancel { background: #cbd5e1; color: #333; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; text-align: center; flex: 1; }
    </style>
</head>
<body>
    <div class="edit-container">
        <h2>✏️ Guhindura: {{ song.title }}</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_meta %}
            {{ form.as_p }}
            <div class="btn-group">
                <button type="submit" class="btn-save">Bika Impinduka</button>
                <a href="{% url 'dashboard' %}" class="btn-cancel">Hagarika</a>
            </div>
        </form>
    </div>
</body>
</html>
